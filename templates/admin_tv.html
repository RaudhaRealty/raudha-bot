<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aktivasi TV Masjid — Raudha</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans">

    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="bg-gradient-to-r from-amber-500 to-orange-600 text-white p-6 rounded-3xl shadow-lg mb-4">
            <h1 class="text-2xl font-black">📺 Aktivasi TV Masjid</h1>
            <p class="text-amber-100 mt-1 text-sm">Tampilkan jam sholat & laporan kas di layar TV masjid Anda.</p>
        </div>

        <!-- Form -->
        <div class="bg-white p-5 rounded-3xl shadow-md border border-slate-200 space-y-3">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Kota / Kabupaten</label>
                <input type="text" id="kotaInput" placeholder="Contoh: Banjarnegara" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl outline-none font-bold text-sm">
                <p class="text-[10px] text-slate-500 mt-1">Digunakan untuk menghitung jadwal sholat di TV.</p>
            </div>
            <button onclick="simpanPengaturan()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-3 rounded-xl text-sm">
                💾 Simpan & Aktifkan TV
            </button>
        </div>

        <!-- Hasil TV Code -->
        <div id="hasilArea" class="hidden mt-4 bg-white p-5 rounded-3xl shadow-md border border-amber-300 space-y-3">
            <div class="text-center">
                <p class="text-xs font-bold text-slate-500 uppercase">Kode TV Anda</p>
                <p class="text-2xl font-black text-amber-600 font-mono tracking-wider" id="tvCodeText">-</p>
            </div>
            
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs break-all">
                <p class="font-bold text-slate-700 mb-1">🔗 Link TV:</p>
                <p id="linkTvText" class="text-blue-600 font-mono text-[10px]">-</p>
            </div>

            <button onclick="salinLink()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-sm">
                📋 Salin Link TV
            </button>
            <p class="text-[10px] text-slate-500 text-center leading-relaxed">Buka link di atas pada browser Smart TV, lalu simpan sebagai Homepage.</p>
        </div>
    </div>

    <script>
        // Ambil param dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const lembagaId = urlParams.get('lembaga_id');
        const userId = urlParams.get('user_id');

        if (!lembagaId || !userId) {
            alert("URL tidak valid. Parameter lembaga_id dan user_id tidak ditemukan.");
        }

        // Muat data awal
        async function loadData() {
            if (!lembagaId || !userId) return;
            try {
                const r = await fetch(`/api/lembaga/${lembagaId}/tv-config?user_id=${userId}`);
                const d = await r.json();
                if (d.status === 'success' && d.tv_code) {
                    document.getElementById('tvCodeText').innerText = d.tv_code;
                    document.getElementById('kotaInput').value = d.kota || '';
                    // URL dinamis dari server
                    const host = window.location.origin;
                    document.getElementById('linkTvText').innerText = `${host}/menu?tv=${d.tv_code}`;
                    document.getElementById('hasilArea').classList.remove('hidden');
                }
            } catch(e) { console.log(e); }
        }
        loadData();

        // Simpan pengaturan
        async function simpanPengaturan() {
            const kota = document.getElementById('kotaInput').value.trim();
            if (!kota) return alert("Isi nama kota terlebih dahulu!");

            try {
                const r = await fetch(`/api/lembaga/${lembagaId}/tv-config`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId, kota: kota })
                });
                const d = await r.json();
                if (d.status === 'success') {
                    document.getElementById('tvCodeText').innerText = d.tv_code;
                    const host = window.location.origin;
                    document.getElementById('linkTvText').innerText = `${host}/menu?tv=${d.tv_code}`;
                    document.getElementById('hasilArea').classList.remove('hidden');
                } else {
                    alert('❌ ' + d.message);
                }
            } catch(e) { alert('❌ ' + e.message); }
        }

        // Salin link
        function salinLink() {
            const text = document.getElementById('linkTvText').innerText;
            navigator.clipboard.writeText(text).then(() => alert('✅ Link disalin!'));
        }
    </script>
</body>
</html>
